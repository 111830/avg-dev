<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordered list in HTML</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <ol>
        <li>Renis Ndregjoni</li>
        <li>Lusiana Hysa</li>
        <li>Redion Xhaferi</li>
    </ol>

    <h1>3 type of list</h1>
    <dl>
        <dt>Renis:</dt>
        <dd>Surname: Ndregjni</dd>
        <dt>Lusi:</dt>
        <dd>Surname: Hysa</dd>
    </dl>
</body>
</html>
